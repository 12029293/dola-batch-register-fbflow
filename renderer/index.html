<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
  <title>Dola 批量注册工作台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <!-- 自绘标题栏（无边框窗口） -->
  <div id="titlebar">
    <div class="tb-brand">
      <span class="status-dot" id="runDot"></span>
      <span class="tb-logo">D</span>
      <span class="tb-title">Dola 批量注册工作台</span>
    </div>
    <div class="tb-controls">
      <button id="tbMin" class="tb-btn" title="最小化" aria-label="最小化">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button id="tbMax" class="tb-btn" title="最大化 / 还原" aria-label="最大化">
        <svg id="iconMax" width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
        <svg id="iconRestore" width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/><path d="M2.5 2.5v-2h7v7h-2" fill="none" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button id="tbClose" class="tb-btn tb-close" title="关闭" aria-label="关闭">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg>
      </button>
    </div>
  </div>

  <!-- 顶栏 -->
  <header id="topbar">
    <div class="top-right">
      <div class="pool-stats mono" id="poolStats">可用 -- · 成功 -- · 失败 --</div>
      <nav class="view-tabs" id="viewTabs">
        <button id="tabBatch" class="active" title="批量注册工作台">⚡ 批量注册</button>
        <button id="tabAccounts" title="账号库：导入 / 删除 / 重置账号">📚 账号库</button>
      </nav>
      <button class="btn-settings" id="btnSettings" title="导出目录 / 代理 / 隐身注册等设置">⚙ 设置</button>
    </div>
  </header>

  <main>
    <!-- ══════════ 视图①：批量注册 ══════════ -->
    <div id="viewBatch" class="view">
      <!-- 控制区 -->
      <section class="panel control-row" id="controlRow">
        <div class="ctrl">
          <label class="ctrl-label" title="-1 = 无上限：每个待注册账号同时开一个独立环境，直到跑完或手动停止">并发数</label>
          <div class="cc-wrap">
            <div class="stepper">
              <button id="ccMinus" aria-label="减少">−</button>
              <span id="ccValue" class="mono">8</span>
              <button id="ccPlus" aria-label="增加">+</button>
            </div>
            <button id="ccUnlimited" class="pill-toggle" title="无上限：每个待注册账号同时开一个环境，直至跑完">∞ 无上限</button>
          </div>
        </div>
        <div class="ctrl">
          <label class="ctrl-label" title="0 = 注册完账号库所有可用账号；断点续跑：中断后再点开始会自动接着注册">本轮限量</label>
          <input type="number" id="maxCount" class="input num-input" value="0" min="0" step="1" />
        </div>
        <label class="ctrl chk" title="批量正常跑完后 60 秒自动关机（夜间挂机用）；取消关机请运行 shutdown /a">
          <input type="checkbox" id="chkShutdown" /> 跑完关机
        </label>
        <div class="ctrl budget-ctrl">
          <label class="ctrl-label">提取预算 <span id="budgetText" class="mono">0/0</span></label>
          <div class="bar"><div class="bar-fill" id="budgetBar"></div></div>
        </div>
        <div class="ctrl grow"></div>
        <button class="btn-secondary" id="btnChainCheck" title="开始批量前预检：Clash 线路 → 隧道 CONNECT → 出口归属 → Dola 可达（消耗 1 次提取额度）">🩺 链路体检</button>
        <button class="btn-primary" id="btnStart">开始批量注册</button>
      </section>

      <div id="chainResult" class="guide hidden"></div>

      <div id="guideHint" class="guide hidden">
        首次使用：先完成初始向导（卡密导入 → 代理 → Google 专线 → 导出目录）
        <a href="#" id="linkWizard">打开向导</a>
      </div>

      <!-- 并发槽位网格 -->
      <section class="panel" id="workerPanel">
        <div class="panel-title">并发队列 <span class="muted" id="queueInfo"></span></div>
        <div class="worker-grid" id="workerGrid">
          <div class="empty-hint" id="workerEmpty">尚未开始。完成配置后点「开始批量注册」，每个账号一张卡片，实时显示进度。</div>
        </div>
      </section>
    </div>

    <!-- ══════════ 视图②：账号库（常用，独立一级视图） ══════════ -->
    <div id="viewAccounts" class="view hidden">
      <section class="panel" id="acctPanel">
        <div class="panel-title">
          账号库 <span class="muted" id="acctChips"></span>
        </div>
        <div class="acct-toolbar">
          <div class="tabs" id="acctFilter">
            <button data-f="all" class="active">全部</button>
            <button data-f="unused">可用</button>
            <button data-f="in_progress">注册中</button>
            <button data-f="used">成功</button>
            <button data-f="failed">失败</button>
          </div>
          <div class="btn-row">
            <button class="btn-accent sm" id="btnImportFile">＋ 导入卡密文件</button>
            <button class="btn-ghost sm" id="btnResetFailed">重置失败为可用</button>
            <button class="btn-ghost sm" id="btnClearFailed">清除失败账号</button>
          </div>
        </div>
        <div id="accountList" class="account-list"></div>
      </section>
    </div>
  </main>

  <!-- 设置抽屉 -->
  <div class="overlay hidden" id="settingsOverlay">
    <div class="drawer" id="settingsDrawer">
      <div class="drawer-head">
        <h2>设置</h2>
        <button class="icon-btn" id="btnCloseSettings" aria-label="关闭">✕</button>
      </div>
      <div class="drawer-body">
        <div class="form-row col">
          <label>导出目录</label>
          <input type="text" id="setExportDir" class="input" placeholder="默认：桌面 DolaCookies">
          <button class="btn-ghost sm" id="btnSaveExportDir">保存导出目录</button>
        </div>
        <div class="form-row col">
          <label>代理提取 API</label>
          <div class="masked mono" id="setExtractMasked">未配置</div>
          <input type="password" id="setExtractUrl" class="input" placeholder="粘贴新的提取 API URL（留空则不修改）">
          <button class="btn-ghost sm" id="btnSaveExtract">保存提取 API</button>
        </div>
        <div class="form-row col">
          <label>连接测试</label>
          <div class="btn-row">
            <button class="btn-ghost sm" id="btnTestNexip">测试提取 API（消耗 1 次提取）</button>
            <button class="btn-ghost sm" id="btnTestGoogle">测试 Google 专线（0 配额）</button>
          </div>
          <div class="test-result mono" id="settingsTestResult"></div>
        </div>
        <div class="form-row col">
          <label>Google 分流线路</label>
          <div class="masked mono" id="setGoogleProxy">未配置</div>
        </div>
        <div class="form-row chk">
          <input type="checkbox" id="setHeadless" />
          <label title="开启后批量注册在后台隐身运行，不弹浏览器窗口；注册结果和 Cookie 照常导出。若 Google 风控拦截率变高可关闭">隐身注册（软件内注册，不弹浏览器）</label>
        </div>
        <div class="form-row col">
          <button class="btn-ghost sm" id="btnRerunWizard">重新运行首次向导</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 首次使用向导（全屏磨砂遮罩 + 居中卡片） -->
  <div class="overlay wizard hidden" id="wizardOverlay">
    <div class="wizard-card">
      <div class="wizard-head">
        <h2>首次使用向导</h2>
        <div class="wizard-steps" id="wizardSteps"></div>
      </div>
      <div class="wizard-body" id="wizardBody"></div>
      <div class="wizard-nav">
        <button class="btn-ghost" id="wizSkip">跳过此步</button>
        <div class="btn-row">
          <button class="btn-ghost" id="wizPrev">上一步</button>
          <button class="btn-primary" id="wizNext">下一步</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
  <script src="app.js"></script>
</body>
</html>
